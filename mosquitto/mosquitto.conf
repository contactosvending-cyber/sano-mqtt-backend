# =============================================================================
# Mosquitto MQTT Broker Configuration
# Sano Vending Machine Backend
# =============================================================================

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# -----------------------------------------------------------------------------
# MQTT Listener - Port 1883 (TCP)
# For backend server and vending machines
# -----------------------------------------------------------------------------
listener 1883
protocol mqtt

# Authentication
allow_anonymous false
password_file /mosquitto/config/passwd

# -----------------------------------------------------------------------------
# WebSocket Listener - Port 9001
# For web clients and monitoring dashboards
# -----------------------------------------------------------------------------
listener 9001
protocol websockets

# Authentication
allow_anonymous false
password_file /mosquitto/config/passwd

# -----------------------------------------------------------------------------
# Security Settings
# -----------------------------------------------------------------------------
# Maximum number of client connections (0 = unlimited)
max_connections -1

# Keep alive interval in seconds
keepalive_interval 60

# Maximum packet size (bytes) - 0 = no limit
# message_size_limit 0

# -----------------------------------------------------------------------------
# QoS and Queuing
# -----------------------------------------------------------------------------
# Max inflight messages per client
max_inflight_messages 20

# Max queued messages per client
max_queued_messages 100

# -----------------------------------------------------------------------------
# Notes for vending machine manufacturer:
# - MQTT TCP:  mqtt://HOST:1883  (for machines)
# - WebSocket: ws://HOST:9001    (for web dashboards)
# - Username: sano_admin
# - Topic format: {mac_address_lowercase_no_colons}
#   Example: MAC 08:7B:3A:F1:22:90 -> topic: 087b3af12290
# -----------------------------------------------------------------------------
